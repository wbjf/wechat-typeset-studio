<!DOCTYPE html>
<html lang="zh-CN" data-app="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公众号排版工作台</title>
<meta name="description" content="粘贴文稿，一键套用 10 套主题，导出可直接粘贴进微信公众号后台的内联样式正文。纯本地运行，文稿不上传。">
<meta name="theme-color" content="#07c160">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307c160'/%3E%3Cpath d='M8 11h16M8 16h16M8 21h10' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ===================== 应用外壳主题 ===================== */
:root{
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f7f8fa; --line:#e3e6ea; --line2:#eef0f3;
  --text:#1f2329; --text2:#5f6672; --text3:#939aa6;
  --brand:#07c160; --brand-soft:#e8faf0;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  --radius:12px;
}
html[data-app="dark"]{
  --bg:#14161a; --panel:#1d2026; --panel2:#23262d; --line:#2f333b; --line2:#2a2e35;
  --text:#e7e9ec; --text2:#a4aab6; --text3:#727884;
  --brand:#0fce68; --brand-soft:#12301f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px; display:flex; flex-direction:column; overflow:hidden;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--text3);}
::-webkit-scrollbar-track{background:transparent;}

/* ===================== 顶栏 ===================== */
.topbar{
  height:56px;flex:0 0 56px;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.2px;}
.brand .logo{
  width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#07c160,#0aa9a0);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800;
}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--text3);letter-spacing:0;margin-top:1px;}
.spacer{flex:1;}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px;}
.seg button{padding:5px 11px;border-radius:7px;font-size:13px;color:var(--text2);transition:.15s;}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600;}
html[data-app="dark"] .seg button.on{background:#343943;box-shadow:none;}
.btn{
  padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);
  font-size:13px;color:var(--text2);transition:.15s;white-space:nowrap;
}
.btn:hover{background:var(--line2);color:var(--text);}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
.btn.primary:hover{filter:brightness(1.06);}
.btn.ghost{background:transparent;}

/* ===================== 工作区 ===================== */
.workspace{flex:1;display:flex;min-height:0;padding:12px;gap:0;}
.pane{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.pane-src{width:var(--left-w,420px);flex:0 0 auto;}
.pane-out{flex:1;min-width:0;background:transparent;box-shadow:none;border-radius:0;}
.splitter{width:12px;flex:0 0 12px;cursor:col-resize;position:relative;}
.splitter::after{content:"";position:absolute;left:5px;top:50%;transform:translateY(-50%);width:2px;height:36px;border-radius:2px;background:var(--line);transition:.15s;}
.splitter:hover::after{background:var(--brand);height:64px;}

/* ---------- 左栏 ---------- */
.pane-head{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:11px 14px;
  border-bottom:1px solid var(--line);font-size:13px;color:var(--text2);
}
.pane-head .title{font-weight:700;color:var(--text);font-size:13.5px;}
.mini{
  padding:4px 9px;border-radius:7px;border:1px solid var(--line);font-size:12px;color:var(--text2);
  transition:.15s;background:var(--panel2);
}
.mini:hover{background:var(--line2);color:var(--text);}
.mini.danger:hover{color:#e5484d;border-color:#f5c2c3;background:#fdf0f0;}
#source{
  flex:1;width:100%;resize:none;border:none;outline:none;background:transparent;
  padding:16px 16px 20px;line-height:1.85;font-size:14px;color:var(--text);
  font-family:'SFMono-Regular',Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
}
#source::placeholder{color:var(--text3);line-height:2;}
.pane-foot{
  flex:0 0 auto;display:flex;gap:14px;align-items:center;padding:9px 14px;
  border-top:1px solid var(--line);font-size:12px;color:var(--text3);background:var(--panel2);
}
.pane-foot b{color:var(--text2);font-weight:600;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--line);}

/* ---------- 右栏 ---------- */
.pane-out{display:flex;flex-direction:column;gap:8px;min-height:0;}
.out-card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;flex:0 0 auto;}
.out-body{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}

/* 主题选择：工具条上的按钮 + 弹出面板。
   10 个主题若常驻铺开要占两行高度，把预览区挤得很小，所以改成按需展开。 */
.tb.tbtn{gap:5px;padding:0 6px;max-width:170px;}
.tb.tbtn .tdots{display:inline-flex;gap:2px;flex:0 0 auto;}
.tb.tbtn .tdots i{width:6px;height:8px;border-radius:2px;display:block;}
.tb.tbtn .tname{
  font-size:12.5px;font-weight:600;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.themepop{
  position:fixed;z-index:66;padding:10px;border-radius:12px;
  width:398px;max-width:calc(100vw - 20px);
  background:var(--panel);border:1px solid var(--line);
  box-shadow:0 8px 14px rgba(16,24,40,.10), 0 20px 44px rgba(16,24,40,.20);
  display:grid;grid-template-columns:repeat(5,1fr);gap:7px;
}
.themepop[hidden]{display:none;}
html[data-app="dark"] .themepop{box-shadow:0 8px 14px rgba(0,0,0,.5), 0 20px 44px rgba(0,0,0,.6);}
.tp-item{
  display:flex;flex-direction:column;gap:6px;min-width:0;padding:7px 8px 8px;
  border:1px solid var(--line);border-radius:9px;background:var(--panel2);
  cursor:pointer;transition:.14s;text-align:left;
}
.tp-item:hover{border-color:var(--text3);}
.tp-item.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand);}
html[data-app="dark"] .tp-item.on{background:#12291d;}
.tp-dots{display:flex;gap:3px;}
.tp-dots i{flex:1;height:9px;border-radius:3px;display:block;border:1px solid rgba(0,0,0,.06);}
.tp-nm{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* 富文本工具条 */
.toolbar{
  display:flex;align-items:center;gap:1px;flex-wrap:wrap;padding:5px 6px;
  border-top:1px solid var(--line);background:var(--panel2);
}
.pane-out .toolbar{border-top:none;}
.tb{
  min-width:26px;height:28px;padding:0 5px;border-radius:7px;font-size:12.5px;color:var(--text2);
  display:inline-flex;align-items:center;justify-content:center;transition:.12s;border:1px solid transparent;
}
.tb:hover{background:var(--panel);color:var(--text);border-color:var(--line);}
.tb:active{transform:scale(.96);}
.tb.b{font-weight:800;} .tb.i{font-style:italic;} .tb.u{text-decoration:underline;} .tb.s{text-decoration:line-through;}
.tb.wide{padding:0 5px;font-size:12px;}
.tb.sel{background:var(--panel);border-color:var(--line);color:var(--text);}
.budget{
  font-size:11.5px;color:var(--text3);padding:3px 9px;border-radius:20px;
  background:var(--panel);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;
}
.budget.warn{color:#b45309;border-color:#f0c98a;background:#fdf6e7;}
html[data-app="dark"] .budget.warn{background:#33270f;border-color:#5c451a;color:#e8b464;}
.budget.over{color:#c0392b;border-color:#f0b5ae;background:#fdf0ee;}
html[data-app="dark"] .budget.over{background:#3a1a17;border-color:#6b2b24;color:#f0857a;}
.tsep{width:1px;height:17px;background:var(--line);margin:0 1px;flex:0 0 auto;}
.colorwrap{position:relative;display:inline-flex;align-items:center;justify-content:center;height:28px;width:32px;border-radius:7px;cursor:pointer;color:var(--text2);}
.colorwrap:hover{background:var(--panel);color:var(--text);}
.colorwrap .bar{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:15px;height:3px;border-radius:2px;}
/* 取色全部交给下面的自绘色板。页面里没有任何 input[type=color]：
   该原生控件在各内核下的渲染差异极大（部分内核直接把调色板画成图片形状的
   占位图标），我们无法控制它的外观，所以不复用它。 */

/* 自绘色板 */
.palette{
  position:fixed;z-index:70;padding:9px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);
  box-shadow:0 8px 14px rgba(16,24,40,.10), 0 18px 40px rgba(16,24,40,.18);
  display:grid;grid-template-columns:repeat(6,20px);gap:6px;
}
.palette[hidden]{display:none;}
.palette .sw{width:20px;height:20px;border-radius:5px;padding:0;border:1px solid rgba(0,0,0,.14);cursor:pointer;transition:transform .12s;}
.palette .sw:hover{transform:scale(1.14);}
.palette .sw.on{box-shadow:0 0 0 2px var(--brand);}
.palette .hexrow{
  grid-column:1 / -1;display:flex;align-items:center;gap:5px;height:26px;
  padding:0 7px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);
}
.palette .hexrow span{font-size:12px;color:var(--text3);}
.palette .hexrow input{
  flex:1;min-width:0;border:0;background:none;outline:none;padding:0;
  font:12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--text);letter-spacing:.4px;text-transform:uppercase;
}
.palette .hexrow input::placeholder{color:var(--text3);text-transform:none;letter-spacing:0;}
.palette .hexrow.bad{border-color:#d9534f;}

/* 样式面板里的「正文颜色」入口：用按钮自绘色块，替代原生取色控件 */
.colbtn{
  width:34px;height:26px;border:1px solid var(--line);border-radius:6px;
  background:none;cursor:pointer;padding:0;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
}
.colbtn:hover{border-color:var(--text3);}
.colbtn i{display:block;width:22px;height:14px;border-radius:4px;}
select.mini{padding:3px 4px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-size:12px;height:28px;}

/* 全局样式面板 */
.style-panel{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:10px 18px;
  padding:12px 14px;border-top:1px solid var(--line);background:var(--panel);
}
.style-panel[hidden]{display:none;}
.fld{display:flex;align-items:center;gap:9px;}
.fld label{font-size:12px;color:var(--text3);flex:0 0 52px;}
.fld input[type=range]{flex:1;min-width:0;accent-color:var(--brand);height:3px;}
.fld .val{font-size:11.5px;color:var(--text2);flex:0 0 40px;text-align:right;font-variant-numeric:tabular-nums;}
.fld select{flex:1;min-width:0;padding:5px 7px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font-size:12px;}
.switch{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);cursor:pointer;user-select:none;}
.switch input{accent-color:var(--brand);width:15px;height:15px;}

/* 右栏底部状态条：当前主题 + 字符预算。放在这里而不是工具条里，
   免得工具条因为塞不下而多折一行。 */
.out-foot{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;
  padding:2px 12px;border-top:1px solid var(--line);background:var(--panel2);
  font-size:11.5px;color:var(--text3);
}
.out-foot b{font-weight:600;color:var(--text2);}
.out-foot .budget{padding:1px 8px;font-size:11px;}

/* 预览区 */
.preview-wrap{flex:1;min-height:0;overflow:auto;padding:14px 14px 30px;background:var(--bg);display:flex;justify-content:center;align-items:flex-start;}
.phone{
  width:375px;flex:0 0 auto;background:#fff;border-radius:16px;
  box-shadow:0 2px 6px rgba(16,24,40,.06), 0 18px 48px rgba(16,24,40,.14);
  border:1px solid rgba(0,0,0,.05);overflow:hidden;
  transition:width .2s ease;
}
html[data-app="dark"] .phone{box-shadow:0 2px 6px rgba(0,0,0,.4), 0 18px 48px rgba(0,0,0,.5);border-color:#000;}
.phone.wide{width:100%;max-width:760px;}
#article{
  outline:none;min-height:280px;overflow-wrap:break-word;word-break:break-word;
  transition:box-shadow .15s;
}
#article:focus{box-shadow:inset 0 0 0 2px rgba(7,193,96,.35);}
#article:empty::before{content:"左侧输入内容后，点「一键排版」";display:block;padding:60px 20px;text-align:center;color:#b9bec7;font-size:13px;}

/* toast */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);
  background:#1f2329;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.22s;z-index:99;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast.err{background:#c0392b;}

/* 拖放 */
.dropmask{
  position:fixed;inset:0;background:rgba(7,193,96,.10);border:3px dashed var(--brand);
  display:none;align-items:center;justify-content:center;z-index:80;color:var(--brand);font-size:17px;font-weight:700;
  backdrop-filter:blur(2px);
}
.dropmask.show{display:flex;}
/* ===================== 我的主题 / 元件 / 图片 / 表格 ===================== */
/* 主题浮层里的分组标题行：左侧文字 + 中间细线 + 右侧小按钮 */
.tp-group{grid-column:1 / -1;display:flex;align-items:center;gap:7px;margin-top:3px;font-size:11.5px;color:var(--text3);}
.tp-group i{flex:1;height:1px;background:var(--line);}
.tp-group button{
  padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);
  font-size:11px;color:var(--text2);transition:.14s;
}
.tp-group button:hover{background:var(--line2);color:var(--text);}
.tp-group button:disabled{opacity:.45;cursor:default;}
.tp-item{position:relative;}
.tp-del{
  position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:50%;
  background:var(--panel);border:1px solid var(--line);color:var(--text3);
  font-size:12px;line-height:14px;text-align:center;display:none;
}
.tp-item:hover .tp-del{display:block;}
.tp-del:hover{color:#e5484d;border-color:#f5c2c3;background:#fdf0f0;}

/* 通用浮层（元件 / 图片 / 表格共用外壳） */
.pop{
  position:fixed;z-index:68;padding:12px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);
  box-shadow:0 8px 14px rgba(16,24,40,.10), 0 20px 44px rgba(16,24,40,.20);
}
html[data-app="dark"] .pop{box-shadow:0 8px 14px rgba(0,0,0,.5), 0 20px 44px rgba(0,0,0,.6);}
.pop[hidden]{display:none;}
.pop-h{display:flex;align-items:center;gap:6px;margin:0 0 9px;font-size:12.5px;font-weight:600;color:var(--text);}
.pop-h small{font-weight:400;font-size:11px;color:var(--text3);}
.pop-row{display:flex;align-items:center;gap:8px;margin:0 0 8px;}
.pop-row>label{flex:0 0 44px;font-size:11.5px;color:var(--text3);}
.pop-row select,.pop-row input[type=text]{
  flex:1;min-width:0;height:26px;padding:0 7px;border-radius:7px;
  border:1px solid var(--line);background:var(--panel2);font-size:12px;outline:none;
}
.pop-row input[type=text]:focus{border-color:var(--brand);}
.pop-row input[type=range]{flex:1;min-width:0;accent-color:var(--brand);height:3px;}
.pop-row .pv{flex:0 0 32px;text-align:right;font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums;}
.pop-foot{display:flex;gap:7px;justify-content:flex-end;margin-top:11px;}
.pop-foot .btn{padding:6px 11px;font-size:12.5px;}
.pop-hint{margin:9px 0 0;font-size:11px;color:var(--text3);line-height:1.7;}

/* 元件选择器 */
.el-list{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:308px;}
.el-item{
  display:flex;flex-direction:column;gap:3px;padding:9px 10px;
  border:1px solid var(--line);border-radius:9px;background:var(--panel2);
  text-align:left;transition:.14s;
}
.el-item:hover{border-color:var(--brand);background:var(--brand-soft);}
.el-item b{font-size:12.5px;font-weight:600;color:var(--text);}
.el-item i{font-style:normal;font-size:11px;color:var(--text3);}

/* 表格可视化编辑 */
.pop-h .tlen{margin-left:auto;font-size:11px;font-weight:400;color:var(--text3);}
.tblwrap{max-width:452px;max-height:216px;overflow:auto;border:1px solid var(--line);border-radius:9px;}
table.tbled{border-collapse:collapse;}
table.tbled td{border:1px solid var(--line);padding:0;background:var(--panel);}
table.tbled tr.head td{background:var(--panel2);}
table.tbled td input{
  display:block;width:104px;padding:6px 8px;border:none;background:none;outline:none;
  font-size:12px;color:var(--text);
}
table.tbled tr.head td input{font-weight:600;}
table.tbled td input:focus{box-shadow:inset 0 0 0 2px var(--brand);border-radius:0;}
.tblbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.tblbar button{
  padding:4px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);
  font-size:11.5px;color:var(--text2);transition:.14s;
}
.tblbar button:hover{background:var(--line2);color:var(--text);}
.tblbar button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--text);font-weight:600;}

/* 居中模态（输入名称等） */
.modal{position:fixed;inset:0;z-index:92;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(16,24,40,.36);}
.modal[hidden]{display:none;}
.modal .mbox{width:340px;max-width:100%;padding:17px;border-radius:12px;background:var(--panel);box-shadow:0 20px 50px rgba(0,0,0,.3);}
.modal h4{margin:0 0 5px;font-size:13.5px;font-weight:600;color:var(--text);}
.modal p{margin:0 0 11px;font-size:12px;line-height:1.75;color:var(--text3);}
.modal input{
  width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);font-size:13px;outline:none;
}
.modal input:focus{border-color:var(--brand);}
.modal .mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:13px;}

@media (max-width:900px){
  .workspace{flex-direction:column;overflow:auto;}
  .pane-src{width:auto!important;height:260px;flex:0 0 auto;}
  .splitter{display:none;}
  .pane-out{min-height:600px;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">排</span>
    <span>公众号排版工作台<small>内联样式 · 粘进后台不丢版</small></span>
  </div>
  <div class="spacer"></div>
  <div class="seg" id="appThemeSeg">
    <button data-t="light" class="on">☀ 白天</button>
    <button data-t="dark">🌙 黑夜</button>
  </div>
  <button class="btn ghost" id="btnWidth" title="切换预览宽度">宽屏预览</button>
  <button class="btn" id="btnExport">导出 HTML</button>

<script>
"use strict";

/* ==========================================================
   0. 基础工具
   ========================================================== */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function css(o){
  return Object.entries(o)
    .filter(([,v]) => v!==null && v!==undefined && v!=='')
    .map(([k,v]) => k+':'+v).join(';');
}
/* st(样式对象, 可被全局控件覆盖的标记) —— 同时把原始字号写进 data-fs，供缩放使用 */
function st(o, fl){
  let d='';
  const fs = parseFloat(o['font-size']);
  if(!isNaN(fs)) d += ' data-fs="'+fs+'"';
  if(fl){
    if(fl.lh)     d += ' data-lh="1"';
    if(fl.ls)     d += ' data-ls="1"';
    if(fl.gap)    d += ' data-gap="1"';
    if(fl.fam)    d += ' data-fam="1"';
    if(fl.color)  d += ' data-color="1"';
    if(fl.indent) d += ' data-indent="1"';
  }
  return 'style="'+css(o)+'"'+d;
}
/* 标记：正文段落 / 一般文字块 */
const T_P   = {lh:1, ls:1, gap:1, fam:1, color:1, indent:1};
const T_BLK = {lh:1, ls:1, fam:1};

const FONT = {
  serif: "'Songti SC','STSong','SimSun','Noto Serif SC',serif",
  kai:   "'Kaiti SC','STKaiti','KaiTi',serif",
  sans:  "-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif",
  mono:  "'SFMono-Regular',Menlo,Consolas,monospace"
};

/* 中文序号 */
const CN  = ['零','一','二','三','四','五','六','七','八','九','十'];
const FM  = ['零','壹','贰','叁','肆','伍','陆','柒','捌','玖','拾'];
function cnNum(n, arr){
  if(n<=10) return arr[n];
  if(n<20)  return arr[1]+'十'+(n>10?arr[n-10]:'');
  if(n<100){ const t=Math.floor(n/10), o=n%10; return arr[t]+'十'+(o?arr[o]:''); }
  return String(n);
}
function formatNum(n, style){
  if(style==='none')   return '';
  if(style==='arabic') return String(n).padStart(2,'0');
  if(style==='formal') return cnNum(n, FM);
  return cnNum(n, CN);
}

/* ==========================================================
   1. 主题定义 —— 全部严格遵守微信内联白名单
      · 只用 section / p / span / img / table 真实元素
      · 不用伪元素 / position / float / flex / grid
      · 装饰一律用真实 span 或 border
   ========================================================== */
function buildTheme(c){
  const base   = c.base || 16;
  const lh     = c.lh   || 1.85;
  const ls     = (c.ls!=null ? c.ls : 0.5) + 'px';
  const gap    = (c.gap!=null ? c.gap : 18);
  /* fontCustom / headFontCustom 是「存为我的主题」写进来的完整字体栈
     （面板里的「苹方」不是 FONT 里的任何一个 key，只能原样存） */
  const font   = c.fontCustom || FONT[c.font || 'sans'];
  const hfont  = c.headFontCustom || FONT[c.headFont || c.font || 'sans'];
  const radius = (c.radius!=null ? c.radius : 6);
  const S = {};

  /* 根容器 */
  S.root = {
    'background-color': c.bg,
    padding: c.pad || '26px 18px 32px',
    color: c.fg,
    'font-size': base+'px',
    'line-height': lh,
    'letter-spacing': ls,
    'font-family': font,
    'text-align':'left'
  };

  /* 标题 / 元信息 / 导语 */
  S.title = {
    'font-size': (c.titleSize || base+7)+'px', 'line-height':'1.5', 'font-weight':'700',
    color: c.heading, 'letter-spacing':'1px', 'font-family': hfont,
    'text-align': c.titleAlign || 'left', margin:'4px 0 6px'
  };
  S.meta = {
    'font-size':'12px','line-height':'1.8', color:c.muted, 'letter-spacing':'1px',
    'text-align': c.titleAlign || 'left', margin:'0 0 26px'
  };
  S.lead = {
    'font-size': (base-1)+'px','line-height':lh, color: c.fgSoft || c.fg, 'letter-spacing':ls,
    'background-color': c.tint, 'border-left':'3px solid '+c.accent,
    padding:'14px 16px', margin:'0 0 28px', 'border-radius': '0 '+radius+'px '+radius+'px 0'
  };

  /* 二级标题 */
  const h2Size = c.h2Size || 18;
  switch(c.h2){
    case 'seal':
      S.h2    = { margin:'44px 0 20px', 'padding-bottom':'9px', 'border-bottom':'1px solid '+c.line };
      S.h2num = { display:'inline-block','background-color':c.accent, color:c.onAccent||c.bg, 'font-family':hfont,
                  'font-size':'14px','line-height':'1.5','letter-spacing':'1px', padding:'2px 9px',
                  'border-radius':'3px','margin-right':'10px','vertical-align':'2px' };
      S.h2txt = { 'font-size':(h2Size+1)+'px','font-weight':'700', color:c.heading, 'letter-spacing':'1.5px','font-family':hfont };
      break;
    case 'card':
      S.h2    = { 'background-color':c.heading, 'border-radius':radius+'px', padding:'11px 15px', margin:'36px 0 18px' };
      S.h2num = { display:'inline-block','background-color':c.accent2, color:'#FFFFFF','font-size':'13px',
                  'line-height':'1.6','letter-spacing':'0.6px', padding:'1px 8px','border-radius':'3px',
                  'margin-right':'9px','vertical-align':'2px' };
      S.h2txt = { 'font-size':h2Size+'px','font-weight':'700', color:'#FFFFFF','letter-spacing':'0.8px' };
      break;
    case 'ribbon':
      S.h2    = { 'background-color':c.tint, 'border-left':'4px solid '+c.accent,
                  'border-radius':'0 '+radius+'px '+radius+'px 0', padding:'10px 14px', margin:'34px 0 16px' };
      S.h2num = { display:'inline-block','background-color':c.accent, color:'#FFFFFF','font-size':'13px',
                  'line-height':'1.6', padding:'1px 8px','border-radius':radius+'px','margin-right':'9px','vertical-align':'2px' };
      S.h2txt = { 'font-size':h2Size+'px','font-weight':'700', color:c.heading, 'letter-spacing':'0.8px' };
      break;
    case 'underline':
      S.h2    = { margin:'38px 0 16px','padding-bottom':'8px','border-bottom':'2px solid '+c.accent };
      S.h2num = { display:'inline-block', color:c.accent,'font-size':'13px','font-weight':'700','letter-spacing':'1px','margin-right':'8px' };
      S.h2txt = { 'font-size':h2Size+'px','font-weight':'700', color:c.heading, 'letter-spacing':'0.8px' };
      break;
    case 'plain':
      S.h2    = { margin:'36px 0 14px' };
      S.h2num = { display:'inline-block', color:c.muted,'font-size':'14px','letter-spacing':'0.6px','margin-right':'8px' };
      S.h2txt = { 'font-size':(h2Size+1)+'px','font-weight':'700', color:c.heading,'letter-spacing':'0.8px' };
      break;
    default: /* bar */
      H2BAR(S, hfont, h2Size, c, radius);
  }

  /* 三级标题 */
  S.h3 = {
    'font-size': (c.h3Size || base)+'px','line-height':'1.8','font-weight':'700',
    color: c.accentDeep || c.accent, 'letter-spacing':'0.6px',
    margin:'28px 0 12px', 'padding-left':'11px','border-left':'3px solid '+c.accent2,
    'font-family': c.h3Font ? hfont : font
  };

  /* 正文 */
  S.p = {
    'font-size': base+'px','line-height':lh, color:c.fg, 'letter-spacing':ls,
    'font-family': font, margin:'0 0 '+gap+'px','text-align':'justify',
    'text-indent': c.indent ? '2em' : null
  };

  /* 行内 */
  S.strong = Object.assign(
    { color: c.strongColor || c.accentDeep || c.accent, 'font-weight':'700' },
    c.strongBg ? { 'background-color':c.tint, padding:'0 3px','border-radius':'2px' } : {}
  );
  S.em     = { 'font-style':'italic', color: c.fgSoft || c.muted };
  S.strike = { 'text-decoration':'line-through', color:c.muted };
  S.codeInline = { 'font-family':FONT.mono, 'font-size':(base-2)+'px','background-color':c.codeBg,
                   color: c.accentDeep || c.accent, padding:'1px 5px','border-radius':'3px' };
  S.a   = { color: c.accentDeep || c.accent, 'text-decoration':'underline' };
  S.sup = { 'font-size':'12px', color:c.accent, 'vertical-align':'super' };

  /* 引用 */
  const quoteP = { 'font-size':(base-1)+'px','line-height':lh, color: c.fgSoft || c.fg, 'letter-spacing':ls, margin:'0 0 10px',
                   'font-family': c.quoteFont ? hfont : font };
  if(c.quote==='line'){
    S.quote = { 'border-left':'2px solid '+c.line, padding:'4px 0 4px 16px', margin:'22px 0' };
  }else if(c.quote==='card'){
    S.quote = { 'background-color':c.tint, 'border-radius':radius+'px', padding:'16px 18px 6px',
                margin:'22px 0', 'border':'1px solid '+c.line };
  }else{
    S.quote = { 'background-color':c.tint, 'border-left':'3px solid '+c.accent,
                'border-radius':'0 3px 3px 0', padding:'16px 18px 6px', margin:'24px 0' };
  }
  S.quoteP   = quoteP;
  S.quoteSrc = { 'font-size':'13px','line-height':'1.8', color:c.muted,'text-align':'right', margin:'0 0 10px' };

  /* 列表 */
  S.ul = { margin:'0 0 '+gap+'px' };
  S.ol = { margin:'0 0 '+gap+'px' };
  S.li = { 'font-size':base+'px','line-height':lh, color:c.fg,'letter-spacing':ls, 'font-family':font,
           margin:'0 0 10px','text-align':'justify' };
  S.liMark = { color:c.accent, 'font-size':(base-3)+'px','margin-right':'9px','font-weight':'700' };
  S.liL1   = { 'padding-left':'20px','font-size':(base-1)+'px', color:c.fgSoft || c.fg };
  S.liNum  = c.liNumBadge
    ? { display:'inline-block','background-color':c.accent, color:'#FFFFFF','font-size':'12px','line-height':'1.5',
        'text-align':'center', width:'19px', padding:'1px 0','border-radius':'3px','margin-right':'9px','vertical-align':'2px' }
    : { display:'inline-block', color: c.accentDeep || c.accent,'font-size':(base-1)+'px','font-weight':'700',
        'line-height':'1.5','margin-right':'8px' };

  /* 代码块 */
  S.code   = { 'background-color':c.codeBg,'border-radius':radius+'px', padding:'14px 16px 6px', margin:'22px 0' };
  S.codeTag= { 'font-size':'11px','line-height':'1.6', color:c.muted,'letter-spacing':'1px', margin:'0 0 8px' };
  S.codeP  = { 'font-family':FONT.mono,'font-size':'13px','line-height':'1.8', color:c.codeText || c.fg,
               margin:'0 0 8px','white-space':'pre-wrap','word-break':'break-all' };

  /* 图片 */
  S.figure    = { margin:'24px 0' };
  S.img       = { display:'block','max-width':'100%', height:'auto', margin:'0 auto','border-radius':radius+'px' };
  S.figcaption= { 'font-size':'12px','line-height':'1.8', color:c.muted,'text-align':'center', margin:'10px 0 0' };

  /* 分割线 */
  S.hr    = { margin:'34px 0','text-align':'center' };
  S.hrTxt = { 'font-size':'12px','line-height':'1.8', color:c.accent2,'letter-spacing':'4px','text-align':'center', margin:'0' };

  /* 表格 */
  S.tableWrap = { margin:'22px 0','overflow-x':'auto' };
  S.table     = { width:'100%','border-collapse':'collapse','font-size':'14px' };
  S.th = { 'background-color':c.tint, color:c.heading,'font-weight':'700','font-size':'14px','line-height':'1.7',
           padding:'9px 10px','border':'1px solid '+c.line,'text-align':'center' };
  S.td = { color:c.fg,'font-size':'14px','line-height':'1.7', padding:'9px 10px','border':'1px solid '+c.line };

  /* 脚注 */
  S.fn      = { margin:'36px 0 0','padding-top':'16px','border-top':'1px solid '+c.line };
  S.fnTitle = { 'font-family':hfont,'font-size':'14px','font-weight':'700', color:c.accentDeep || c.accent,
                'letter-spacing':'2px', margin:'0 0 10px' };
  S.fnItem  = { 'font-size':'12px','line-height':'1.8', color:c.muted,'letter-spacing':'0.5px',
                'word-break':'break-all', margin:'0 0 6px' };

  return { cfg:c, styles:S, mark:c.mark||'◆', divider:c.divider||'◆　◆　◆', h2num:c.h2num||'common' };
}

function H2BAR(S, hfont, h2Size, c, radius){
  S.h2    = { margin:'40px 0 16px','padding-left':'12px','border-left':'3px solid '+c.accent };
  S.h2num = { display:'inline-block', color:c.accent,'font-size':'14px','line-height':'1.6','letter-spacing':'0.6px',
              'margin-right':'8px','vertical-align':'1px' };
  S.h2txt = { 'font-size':h2Size+'px','font-weight':'700', color:c.heading,'letter-spacing':'0.8px','font-family':hfont };
}

/* ---------- 主题清单 ---------- */
const THEME_LIST = [
  { id:'gu-feng', name:'古风宣纸', desc:'人文 / 历史 / 掌故', swatch:['#9E2B25','#FBF7EF','#C4A56B'],

/* ----------------------------------------------------------
   使用者自己存下来的主题：结构跟 THEME_LIST 完全一致，
   额外带 custom:true 以便在浮层里分组与删除。
   存在 localStorage，可导出成 JSON 分享给别人。
   ---------------------------------------------------------- */
const CUSTOM_KEY = 'wxt-custom-themes';
let customThemes = [];

function loadCustomThemes(){
  try{
    const raw = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]');
    customThemes = Array.isArray(raw) ? raw.filter(t => t && t.id && t.cfg) : [];
  }catch(e){ customThemes = []; }
}
function saveCustomThemes(){
  try{ localStorage.setItem(CUSTOM_KEY, JSON.stringify(customThemes)); }catch(e){}
}
/* 内置 + 自定义。凡是按 id 取主题的地方都走这里。 */
function allThemes(){
  return THEME_LIST.concat(customThemes);
}
function themeSwatch(t){
  if(t.swatch && t.swatch.length) return t.swatch;
  const c = t.cfg || {};
  return [c.accent || '#888888', c.bg || '#FFFFFF', c.heading || c.accent || '#333333'];
}

/* ----------------------------------------------------------

   也就是左侧文档里的一行正文 —— 因此它跟文稿一起被保存、

   每个 build(cfg, args) 都必须只产出 section / p / span，
   颜色取自当前主题，所以任何主题下都不会突兀。
   ---------------------------------------------------------- */
const ELEM_MAP = {};
function defElem(id, name, desc, fields, build){

}

const RE_HEAD   = /^(#{1,6})\s+(.*)$/;
const RE_QUOTE  = /^>\s?(.*)$/;
const RE_UL     = /^(\s*)[-*+]\s+(.*)$/;
const RE_OL     = /^(\s*)\d+[.、)]\s+(.*)$/;
const RE_HR     = /^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/;
const RE_IMG    = /^!\[([^\]]*)\]\(([^)]+)\)\s*$/;
const RE_FENCE  = /^```(.*)$/;
const RE_TSEP   = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
/* 装饰元件：::follow 第一段 | 第二段 —— 竖线分隔各字段 */
const RE_ELEM   = /^::([a-z][a-z0-9-]*)\s*(.*)$/;

function isBlockStart(l){
  return !l.trim() || RE_HEAD.test(l) || RE_QUOTE.test(l) || RE_UL.test(l) ||
         RE_OL.test(l) || RE_HR.test(l) || RE_FENCE.test(l) || RE_ELEM.test(l);
}
function splitRow(l){
  return l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(s=>s.trim());
}

function parseSource(src){
  const meta = {};
  let body = src.replace(/\r\n?/g,'\n');

  const fm = body.match(/^---\n([\s\S]*?)\n---\n?/);
  if(fm){
    fm[1].split('\n').forEach(line=>{
      const i = line.indexOf(':');
      if(i>0){
        const k = line.slice(0,i).trim().toLowerCase();
        const v = line.slice(i+1).trim().replace(/^["']|["']$/g,'');
        if(k) meta[k] = v;
      }
    });
    body = body.slice(fm[0].length);
  }

  const lines = body.split('\n');
  const blocks = [];
  let i = 0;

  while(i < lines.length){
    const line = lines[i];
    if(!line.trim()){ i++; continue; }

    /* 代码围栏 */
    let m;
    if(m = line.match(RE_FENCE)){
      const tag = m[1].trim();
      const buf = []; i++;
      while(i<lines.length && !RE_FENCE.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      blocks.push({type:'code', tag, lines:buf});
      continue;
    }
    /* 装饰元件（::follow / ::card / ::past / ::quote / ::tip） */
    if(m = line.match(RE_ELEM)){
      if(ELEM_MAP[m[1]]){
        blocks.push({type:'elem', elem:m[1], args:m[2].split('|').map(s=>s.trim())});
        i++; continue;
      }
    }
    /* 分割线 */
    if(RE_HR.test(line)){ blocks.push({type:'hr'}); i++; continue; }
    /* 表格 */
    if(line.includes('|') && i+1<lines.length && RE_TSEP.test(lines[i+1]) && lines[i+1].includes('-')){
      const head = splitRow(line);
      i += 2;
      const rows = [];
      while(i<lines.length && lines[i].trim() && lines[i].includes('|')){ rows.push(splitRow(lines[i])); i++; }
      blocks.push({type:'table', head, rows});
      continue;
    }
    /* 标题 */
    if(m = line.match(RE_HEAD)){
      blocks.push({type:'h'+Math.min(m[1].length,3), text:m[2].trim()});
      i++; continue;
    }
    /* 引用 */
    if(RE_QUOTE.test(line)){
      const buf = [];
      while(i<lines.length && RE_QUOTE.test(lines[i])){ buf.push(lines[i].match(RE_QUOTE)[1]); i++; }
      blocks.push({type:'quote', text:buf.join('\n')});
      continue;
    }
    /* 无序列表 */
    if(m = line.match(RE_UL)){
      const items = [];
      while(i<lines.length && RE_UL.test(lines[i])){ items.push(lines[i].match(RE_UL)[2]); i++; }
      blocks.push({type:'ul', items});
      continue;
    }
    /* 有序列表 */
    if(m = line.match(RE_OL)){
      const items = [];
      while(i<lines.length && RE_OL.test(lines[i])){ items.push(lines[i].match(RE_OL)[2]); i++; }
      blocks.push({type:'ol', items});
      continue;
    }
    /* 独占一行图片 */
    if(m = line.match(RE_IMG)){
      blocks.push({type:'img', alt:m[1], src:m[2]});
      i++; continue;
    }
    /* 段落 */
    const buf = [line.trim()]; i++;
    while(i<lines.length && !isBlockStart(lines[i]) && !RE_IMG.test(lines[i])){ buf.push(lines[i].trim()); i++; }
    blocks.push({type:'p', text:buf.join(' ')});
  }
  return {meta, blocks};
}

/* 行内格式 */
function inline(text, ctx){
  let s = esc(text);

  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_,c)=>{ codes.push(c); return '\u0001'+(codes.length-1)+'\u0001'; });

  s = s.replace(/\*\*([^*\n]+)\*\*/g, (_,c)=>'<strong '+st(ctx.S.strong)+'>'+c+'</strong>');
  s = s.replace(/~~([^~\n]+)~~/g,      (_,c)=>'<span '+st(ctx.S.strike)+'>'+c+'</span>');
  s = s.replace(/(^|[^*\n])\*([^*\n]+)\*/g, (_,p,c)=>p+'<em '+st(ctx.S.em)+'>'+c+'</em>');

  s = s.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (_,t,u)=>{
    if(ctx.footnote && /^https?:\/\//i.test(u)){
      ctx.footnotes.push({t, u});
      return '<span '+st(ctx.S.sup)+'>['+ctx.footnotes.length+']</span>';
    }
    return '<a href="'+u+'" '+st(ctx.S.a)+'>'+t+'</a>';
  });

  s = s.replace(/\u0001(\d+)\u0001/g, (_,i)=>'<span '+st(ctx.S.codeInline)+'>'+codes[+i]+'</span>');
  return s;
}

/* ==========================================================
   3. 渲染
   ========================================================== */
const state = {
  source:'', theme:null, appTheme:'light',
  wide:false, titleBlock:true, footnote:true, slim:true,
  g:{ size:null, lh:null, ls:null, gap:null, family:'', color:'', useColor:false, indent:false },
  /* 图片资源表：key → { src, w, h, radius, align, shadow, bytes, name }
     左侧文档里只写 `![图注](asset:key)`，图片本体存在这里。
     这样左侧文稿始终是可读的纯文本，而且换主题、重新排版都不会丢图。 */
  assets:{}
};

function getTheme(id){
  return allThemes().find(t=>t.id===id) || THEME_LIST[0];
}

function renderArticle(){
  const T = state.theme;
  const S = T.styles;
  const parsed = parseSource(state.source);

  const ctx = { S, footnote:state.footnote, footnotes:[], sectionNo:0, meta:parsed.meta };

  const h2numStyle = parsed.meta.h2_num || T.h2num;
  const dividerTxt = parsed.meta.divider || T.divider;

  const blocks = parsed.blocks.slice();
  const parts = [];

  /* 标题 + 元信息 + 导语 */
  let titleText = parsed.meta.title || '';
  if(blocks.length && blocks[0].type==='h1'){
    if(!titleText) titleText = blocks[0].text;
    blocks.shift();
  }
  if(state.titleBlock && titleText){
    parts.push('<p '+st(S.title)+'>'+inline(titleText, ctx)+'</p>');
    const metaLine = [parsed.meta.author, parsed.meta.date].filter(Boolean).join('　·　');
    if(metaLine) parts.push('<p '+st(S.meta)+'>'+esc(metaLine)+'</p>');
  }
  if(parsed.meta.lead){
    parts.push('<p '+st(S.lead, T_BLK)+'>'+inline(parsed.meta.lead, ctx)+'</p>');
  }

  /* 正文 */
  for(const b of blocks){
    switch(b.type){
      case 'h1':
        parts.push('<p '+st(S.title)+'>'+inline(b.text, ctx)+'</p>');
        break;
      case 'h2': {
        ctx.sectionNo++;
        const label = formatNum(ctx.sectionNo, h2numStyle);
        const num = label ? '<span '+st(S.h2num)+'>'+esc(label)+'</span> ' : '';
        parts.push('<section '+st(S.h2)+'>'+num+'<span '+st(S.h2txt)+'>'+inline(b.text, ctx)+'</span></section>');
        break;
      }
      case 'h3':
        parts.push('<p '+st(S.h3)+'>'+inline(b.text, ctx)+'</p>');
        break;
      case 'p':
        parts.push('<p '+st(S.p, T_P)+'>'+inline(b.text, ctx)+'</p>');
        break;
      case 'quote':
        parts.push('<section '+st(S.quote)+'>'+
          b.text.split('\n').map(l=>'<p '+st(S.quoteP, T_BLK)+'>'+inline(l, ctx)+'</p>').join('')+
          '</section>');
        break;
      case 'ul':
        parts.push('<section '+st(S.ul)+'>'+
          b.items.map(it=>'<p '+st(S.li, T_P)+'><span '+st(S.liMark)+'>'+esc(T.mark)+'</span>'+inline(it, ctx)+'</p>').join('')+
          '</section>');
        break;
      case 'ol':
        parts.push('<section '+st(S.ol)+'>'+
          b.items.map((it,i)=>'<p '+st(S.li, T_P)+'><span '+st(S.liNum)+'>'+(i+1)+'</span>'+inline(it, ctx)+'</p>').join('')+
          '</section>');
        break;
      case 'hr':
        parts.push('<section '+st(S.hr)+'><p '+st(S.hrTxt)+'>'+esc(dividerTxt)+'</p></section>');
        break;
      case 'elem': {
        const def = ELEM_MAP[b.elem];
        if(def) parts.push(def.build(T.cfg, b.args));
        break;
      }
      case 'code':
        parts.push('<section '+st(S.code)+'>'+
          (b.tag ? '<p '+st(S.codeTag)+'>'+esc(b.tag)+'</p>' : '') +
          b.lines.map(l=>'<p '+st(S.codeP)+'>'+(esc(l)||' ')+'</p>').join('')+
          '</section>');
        break;
      case 'img': {
        const asset = b.src.indexOf('asset:') === 0 ? state.assets[b.src.slice(6)] : null;
        if(b.src.indexOf('asset:') === 0 && !asset){
          parts.push('<section '+st(S.figure)+'><p '+st(S.figcaption)+'>'+
            '［图片未找到：'+esc(b.src)+'，可能因为浏览器存储被清空，请重新插入］</p></section>');
          break;
        }
        const imgStyle = Object.assign({}, S.img);
        if(asset){
          if(asset.radius != null) imgStyle['border-radius'] = asset.radius+'px';
          if(asset.align === 'left')  imgStyle.margin = '0 auto 0 0';
          if(asset.align === 'right') imgStyle.margin = '0 0 0 auto';
          if(asset.shadow) imgStyle['box-shadow'] = '0 6px 18px rgba(16,24,40,.18)';
        }
        parts.push('<section '+st(S.figure)+'>'+
          '<img src="'+esc(asset ? asset.src : b.src)+'" alt="'+esc(b.alt)+'" '+st(imgStyle)+'>'+
          (b.alt ? '<p '+st(S.figcaption)+'>'+esc(b.alt)+'</p>' : '')+
          '</section>');
        break;
      }
      case 'table': {
        const head = '<tr>'+b.head.map(c=>'<td '+st(S.th)+'>'+inline(c, ctx)+'</td>').join('')+'</tr>';
        const body = b.rows.map(r=>'<tr>'+b.head.map((_,i)=>'<td '+st(S.td)+'>'+inline(r[i]||'', ctx)+'</td>').join('')+'</tr>').join('');
        parts.push('<section '+st(S.tableWrap)+'><table '+st(S.table)+'><tbody>'+head+body+'</tbody></table></section>');
        break;
      }
    }
  }

  /* 参考资料 */
  if(ctx.footnotes.length){
    const t = parsed.meta.footnote_title || '参考资料';
    parts.push('<section '+st(S.fn)+'><p '+st(S.fnTitle)+'>'+esc(t)+'</p>'+
      ctx.footnotes.map((f,i)=>'<p '+st(S.fnItem)+'>['+(i+1)+'] '+esc(f.t)+'　'+esc(f.u)+'</p>').join('')+
      '</section>');
  }

  article.innerHTML = parts.join('\n');
  article.setAttribute('style', css(S.root));
  applyGlobal();
  updateStats();
  scheduleBudget();
}

/* ==========================================================
   4. 全局样式覆盖（不重排，手动改的内容不会丢）
   ========================================================== */
function applyGlobal(){
  const base = state.theme.cfg.base || 16;
  const g = state.g;
  const scale = g.size ? g.size/base : 1;

  article.querySelectorAll('[data-fs]').forEach(el=>{
    const f = parseFloat(el.dataset.fs);
    if(!isNaN(f)) el.style.fontSize = (f*scale).toFixed(2)+'px';
  });
  if(g.lh) article.querySelectorAll('[data-lh]').forEach(el=>{ el.style.lineHeight = g.lh; });
  if(g.ls!=null) article.querySelectorAll('[data-ls]').forEach(el=>{ el.style.letterSpacing = g.ls+'px'; });
  if(g.gap!=null) article.querySelectorAll('[data-gap]').forEach(el=>{ el.style.marginBottom = g.gap+'px'; });
  if(g.family) article.querySelectorAll('[data-fam]').forEach(el=>{ el.style.fontFamily = g.family; });
  if(g.useColor && g.color) article.querySelectorAll('[data-color]').forEach(el=>{ el.style.color = g.color; });
  /* 缩进：面板勾选优先；未勾选但主题自带缩进（自定义主题存过）时也要保留 */
  const themeIndent = !!state.theme.cfg.indent;
  article.querySelectorAll('[data-indent]').forEach(el=>{
    el.style.textIndent = (g.indent || themeIndent) ? '2em' : '0';
  });
}

/* ==========================================================
   5. 导出 / 复制：把手动编辑产生的标签归一成微信安全结构
   ========================================================== */
function normalizeForWechat(root){
  const S = state.theme.styles;

  /* 选择器 / 字体颜色产生的 font 标签 */
  root.querySelectorAll('font[size], font[color], font[face]').forEach(f=>{
    const span = document.createElement('span');
    const sz = f.getAttribute('size');
    if(sz && /^\d+$/.test(sz)) span.style.fontSize = parseInt(sz,10)+'px';
    if(f.getAttribute('color')) span.style.color = f.getAttribute('color');
    span.innerHTML = f.innerHTML;
    f.replaceWith(span);
  });

  /* 引用块 */
  root.querySelectorAll('blockquote').forEach(q=>{
    const sec = document.createElement('section');
    sec.setAttribute('style', css(S.quote));
    [...q.childNodes].forEach(n=>{
      const p = document.createElement('p');
      p.setAttribute('style', css(S.quoteP));
      p.innerHTML = n.nodeType===1 ? n.innerHTML : esc(n.textContent);
      sec.appendChild(p);
    });
    q.replaceWith(sec);
  });

  /* 列表 */
  root.querySelectorAll('ul, ol').forEach(list=>{
    const ordered = list.tagName === 'OL';
    const sec = document.createElement('section');
    sec.setAttribute('style', css(ordered ? S.ol : S.ul));
    [...list.children].forEach((li, idx)=>{
      if(li.tagName !== 'LI') return;
      const p = document.createElement('p');
      p.setAttribute('style', css(S.li));
      const badge = document.createElement('span');
      badge.setAttribute('style', css(ordered ? S.liNum : S.liMark));
      badge.textContent = ordered ? String(idx+1) : state.theme.mark;
      p.appendChild(badge);
      p.insertAdjacentHTML('beforeend', li.innerHTML);
      sec.appendChild(p);
    });
    list.replaceWith(sec);
  });

  /* 手动插入的标题 */
  root.querySelectorAll('h1, h2').forEach(h=>{
    const sec = document.createElement('section');
    sec.setAttribute('style', css(S.h2));
    const span = document.createElement('span');
    span.setAttribute('style', css(S.h2txt));
    span.innerHTML = h.innerHTML;
    sec.appendChild(span);
    h.replaceWith(sec);
  });
  root.querySelectorAll('h3, h4, h5, h6').forEach(h=>{
    const p = document.createElement('p');
    p.setAttribute('style', css(S.h3));
    p.innerHTML = h.innerHTML;
    h.replaceWith(p);
  });

  /* hr */
  root.querySelectorAll('hr').forEach(hr=>{
    const sec = document.createElement('section');
    sec.setAttribute('style', css(S.hr));
    const p = document.createElement('p');
    p.setAttribute('style', css(S.hrTxt));
    p.textContent = state.theme.divider;
    sec.appendChild(p);
    hr.replaceWith(sec);
  });

  /* 图片兜底样式：只补没有 style 的（手动粘进来的），
     已经带 style 的必须原样保留，否则「圆角 / 阴影 / 对齐」这些逐图设置会被抹掉 */
  root.querySelectorAll('img').forEach(img=>{
    if(!img.getAttribute('style')) img.setAttribute('style', css(S.img));
  });

  /* 清理属性：微信只认 style，其余全部去掉（根节点自身也要清） */
  cleanAttrs(root);
  root.querySelectorAll('*').forEach(cleanAttrs);
  return root;
}

const KEEP_ATTR = ['style', 'src', 'alt', 'href', 'colspan', 'rowspan'];
const BAD_DECL  = /(^|;)\s*(position|float|flex|grid|transform|transition|animation|z-index|filter|cursor|content)\s*:/i;

function cleanAttrs(el){
  [...el.attributes].forEach(a=>{
    if(!KEEP_ATTR.includes(a.name)) el.removeAttribute(a.name);
  });
  if(el.hasAttribute('style')){
    const kept = el.getAttribute('style').split(';')
      .filter(d => d.trim() && !BAD_DECL.test(';' + d)).join(';');
    el.setAttribute('style', kept);
  }
}

function buildExportHtml(slim){
  const useSlim = (slim === undefined) ? state.slim : slim;
  const clone = article.cloneNode(true);
  clone.removeAttribute('contenteditable');
  clone.removeAttribute('spellcheck');
  normalizeForWechat(clone);
  if(useSlim) slimStyles(clone);
  return clone.outerHTML;
}

/* ----------------------------------------------------------
   样式瘦身：删掉「与祖先同值、且可被继承」的声明，靠继承生效。
   只删与祖先完全相同的值，所以渲染结果不变，纯粹省字符。
   微信 draft/add 接口 content 上限 20000 字符（标签和属性全算）。
   ---------------------------------------------------------- */
const INHERITABLE = new Set([
  'color','font','font-family','font-size','font-style','font-weight','font-variant',
  'line-height','letter-spacing','word-spacing','text-align','text-indent',
  'white-space','word-break','word-wrap','overflow-wrap'
]);

function slimStyles(root){
  const walk = (el, ctx)=>{
    const attr = el.getAttribute('style');
    if(!attr){
      [...el.children].forEach(c=>walk(c, ctx));
      return;
    }
    const local = new Map(ctx);
    const kept = [];
    attr.split(';').forEach(d=>{
      d = d.trim();
      if(!d) return;
      const i = d.indexOf(':');
      if(i < 0){ kept.push(d); return; }
      const k = d.slice(0,i).trim().toLowerCase();
      const v = d.slice(i+1).trim();
      if(INHERITABLE.has(k) && local.get(k) === v) return;  /* 与祖先相同 → 交给继承 */
      kept.push(k+':'+v);
      local.set(k, v);
    });
    el.setAttribute('style', kept.join(';'));
    [...el.children].forEach(c=>walk(c, local));
  };
  walk(root, new Map());
}

/* 微信接口 20000 字符预算提示（只对 draft/add 接口，复制粘贴无此限制） */
let budgetTimer = null;
function scheduleBudget(){
  clearTimeout(budgetTimer);
  budgetTimer = setTimeout(updateBudget, 500);
}
function updateBudget(){
  const el = $('#charBudget');
  if(!el) return;
  let n = 0, full = 0;
  try{
    n = buildExportHtml(true).length;
    full = buildExportHtml(false).length;
  }catch(e){ return; }
  const LIMIT = 20000;
  const saved = full > 0 ? Math.round((1 - n/full) * 100) : 0;
  el.textContent = n.toLocaleString('en-US') + ' / 20,000 字符';
  el.classList.toggle('warn', n > LIMIT*0.8 && n <= LIMIT);
  el.classList.toggle('over', n > LIMIT);
  el.title =
    (n > LIMIT
      ? '超出接口上限：复制粘贴到后台仍然可用，但推草稿箱接口会被拒。可以考虑精简装饰或拆分文章。\n'
      : '微信 draft/add 接口的 content 上限为 20000 字符，标签与属性全部计入。复制粘贴没有这个限制。\n') +
    (state.slim ? `已开启样式瘦身，比未瘦身节省 ${saved}% 字符（${full.toLocaleString('en-US')} → ${n.toLocaleString('en-US')}）。\n` : '当前未瘦身。\n') +
    '若粘贴后发现个别文字字号或字体不对，把「样式瘦身」关掉再复制一次即可。';
}

/* 居中输入框，返回 Promise<string|null>（确定给值，取消/关闭给 null）。
   不用原生 prompt()：外观不可控，还会阻塞渲染。 */
function askText(opt){
  opt = opt || {};
  const modal = $('#askModal'), inp = $('#askInput');
  $('#askTitle').textContent = opt.title || '';
  $('#askDesc').textContent  = opt.desc  || '';
  $('#askDesc').hidden = !opt.desc;
  $('#askOk').textContent = opt.ok || '确定';
  inp.value = opt.value || '';
  inp.placeholder = opt.placeholder || '';
  modal.hidden = false;
  inp.focus(); inp.select();
  return new Promise(res=>{
    const done = v=>{
      modal.hidden = true;
      $('#askOk').removeEventListener('click', onOk);
      $('#askCancel').removeEventListener('click', onNo);
      inp.removeEventListener('keydown', onKey);
      modal.removeEventListener('mousedown', onBg);
      res(v);
    };
    const onOk  = ()=>done(inp.value);
    const onNo  = ()=>done(null);
    const onKey = e=>{
      e.stopPropagation();
      if(e.key === 'Enter'){ e.preventDefault(); done(inp.value); }
      if(e.key === 'Escape'){ e.preventDefault(); done(null); }
    };
    const onBg = e=>{ if(e.target === modal) done(null); };
    $('#askOk').addEventListener('click', onOk);
    $('#askCancel').addEventListener('click', onNo);
    inp.addEventListener('keydown', onKey);
    modal.addEventListener('mousedown', onBg);
  });
}

async function copyRich(){
  const html = buildExportHtml();
  const text = article.innerText;
  try{
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([ new ClipboardItem({
        'text/html' : new Blob([html], {type:'text/html'}),
        'text/plain': new Blob([text], {type:'text/plain'})
      }) ]);
      toast('已复制富文本，去公众号后台正文区 Ctrl+V 即可');
      return;
    }
    throw new Error('no clipboard api');
  }catch(e){
    /* 兜底：选中正文再复制 */
    try{
      const range = document.createRange();
      range.selectNodeContents(article);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
      const ok = document.execCommand('copy');
      sel.removeAllRanges();
      toast(ok ? '已复制（兼容模式），去后台 Ctrl+V' : '复制失败，请手动全选正文后 Ctrl+C', !ok);
    }catch(err){
      toast('复制失败，请手动全选正文后 Ctrl+C', true);
    }
  }
}

/* ==========================================================
   7. 富文本编辑（选区保持 + 微信安全化）
   ========================================================== */
const article = $('#article');
let savedRange = null;

document.addEventListener('selectionchange', ()=>{
  const sel = window.getSelection();
  if(sel.rangeCount && article.contains(sel.anchorNode)){
    savedRange = sel.getRangeAt(0).cloneRange();
  }
});
function restoreSel(){
  const sel = window.getSelection();
  const inside = sel.rangeCount && article.contains(sel.anchorNode);
  if(!inside) article.focus();
  if(savedRange){
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }else{
    /* 从没在正文里落过光标：收到末尾，否则 execCommand 不知道该往哪插 */
    const r = document.createRange();
    r.selectNodeContents(article);
    r.collapse(false);
    sel.removeAllRanges();
    sel.addRange(r);
    savedRange = r.cloneRange();
  }
}
function exec(cmd, val){
  restoreSel();
  try{
    document.execCommand('styleWithCSS', false, true);
    document.execCommand(cmd, false, val===undefined?null:val);
  }catch(e){ /* ignore */ }
}

/* 选中文字改字号：先打 font[size=7] 再换 span */
function setSelectionFontSize(px){
  restoreSel();
  document.execCommand('styleWithCSS', false, true);
  document.execCommand('fontSize', false, '7');
  article.querySelectorAll('font[size="7"]').forEach(f=>{
    const span = document.createElement('span');
    span.style.fontSize = px+'px';
    span.innerHTML = f.innerHTML;
    f.replaceWith(span);
  });
}

/* ----------------------------------------------------------
   图片：先用 canvas 重编码再入库
   公众号正文宽度约 677px，2 倍屏也只要 1354px，所以默认压到 1080
   已经很够看，而 base64 的体积是按像素数走的，不压会把字符预算直接吃光。
   ---------------------------------------------------------- */
const IMG_OPTS = { maxW:1080, quality:82, radius:null, align:'center', shadow:false, caption:'', format:'auto' };

/* 缩到 32×32 扫一遍 alpha，判断要不要保留 PNG 的透明通道 */
function imgHasAlpha(img){
  const n = 32;
  const cv = document.createElement('canvas');
  cv.width = n; cv.height = n;
  const cx = cv.getContext('2d');
  cx.drawImage(img, 0, 0, n, n);
  let d;
  try{ d = cx.getImageData(0, 0, n, n).data; }catch(e){ return false; }
  for(let i = 3; i < d.length; i += 4){ if(d[i] < 250) return true; }
  return false;
}

function compressImage(file, maxW, quality, format){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW / (img.naturalWidth || maxW));
      const w = Math.max(1, Math.round((img.naturalWidth  || maxW) * scale));
      const h = Math.max(1, Math.round((img.naturalHeight || maxW) * scale));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const cx = cv.getContext('2d');
      const keepAlpha = (format === 'png') ||
                        (format === 'auto' && /^image\/(png|webp|gif)/.test(file.type) && imgHasAlpha(img));
      if(!keepAlpha){ cx.fillStyle = '#FFFFFF'; cx.fillRect(0, 0, w, h); }
      cx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const mime = keepAlpha ? 'image/png' : 'image/jpeg';
      resolve({ src: cv.toDataURL(mime, keepAlpha ? undefined : quality / 100),
                w, h, mime, origW: img.naturalWidth, origH: img.naturalHeight });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('decode failed')); };
    img.src = url;
  });
}

function nextAssetKey(){
  let n = 1;
  while(state.assets['img' + n]) n++;
  return 'img' + n;
}

/* 图注会被塞进 ![...]，方括号和换行会破坏语法，先清掉 */
function cleanCaption(s){
  return (s || '').replace(/[\r\n]+/g, ' ').replace(/[[\]]/g, '').trim();
}

async function insertImageFile(file, opts){
  if(!file || !/^image\//.test(file.type)){ toast('这个文件不是图片', true); return; }
  const o = Object.assign({}, IMG_OPTS, opts || {});
  o.caption = cleanCaption(o.caption);
  let out;
  try{ out = await compressImage(file, o.maxW, o.quality, o.format); }
  catch(e){ toast('这张图片读不出来，换一张试试', true); return; }

  const key = nextAssetKey();
  state.assets[key] = {
    src: out.src, w: out.w, h: out.h,
    radius: o.radius, align: o.align, shadow: !!o.shadow,
    name: file.name || '', kb: Math.round(out.src.length / 1024)
  };
  sourceInsert('![' + o.caption + '](asset:' + key + ')');

  const ratio = out.origW ? Math.round(out.w / out.origW * 100) : 100;
  toast('图片已插入 ' + out.w + '×' + out.h + '（约 ' + state.assets[key].kb + 'KB，原图 ' +
        out.origW + '×' + out.origH + ' 已缩到 ' + ratio + '%）');
}

/* 粘贴净化 */
function sanitizeHtml(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,meta,link,iframe,object,embed,form,input').forEach(n=>n.remove());
  const KEEP = ['style','href','src','alt','colspan','rowspan'];
  const BAD  = /(^|;)\s*(position|float|flex|grid|transform|transition|animation|z-index|filter|cursor|content)\s*:/i;
  doc.body.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(a=>{ if(!KEEP.includes(a.name)) el.removeAttribute(a.name); });
    if(el.hasAttribute('style')){
      const kept = el.getAttribute('style').split(';').filter(d=>d.trim() && !BAD.test(';'+d)).join(';');
      el.setAttribute('style', kept);
    }
  });
  return doc.body.innerHTML;
}

article.addEventListener('paste', e=>{
  const dt = e.clipboardData;
  if(!dt) return;
  const html = dt.getData('text/html');
  if(html){
    e.preventDefault();
    document.execCommand('insertHTML', false, sanitizeHtml(html));
  }else{
    const text = dt.getData('text/plain');
    if(text){
      e.preventDefault();
      document.execCommand('insertText', false, text);
    }
  }
});
article.addEventListener('drop', e=>{
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(f && /^image\//.test(f.type)){ e.preventDefault(); insertImageFile(f); }
});

/* ---------- 取色：自绘色板 ----------
   页面里完全不用原生 input[type=color]。它在各内核下的外观差异极大，部分内核
   会把调色板直接画成「图片形状」的占位图标（表现为工具栏里出现裂图），而我们
   无法对它做任何样式控制。取色因此全部由下面的自绘色板 + 十六进制输入框承担。 */
const SWATCH = {
  fg: ['#000000','#3D3428','#5C5C5C','#8C8C8C','#9E2B25','#C0392B',

const POPS = [];

/* 浮层是 position:fixed，页面一滚就会跟按钮错位。
   早期做法是「一滚就关」，但浏览器把浮层滚进视口这种自己也触发 scroll，
   浮层会在刚打开时被自己关掉。改成跟着锚点重新定位。 */
function positionPop(pop){
  const anchor = pop._anchor;
  if(!anchor) return;                        /* 还没挂到锚点上，交给 placePop */
  if(!anchor.isConnected){ pop.hidden = true; return; }
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  let top = r.bottom + 6;
  if(top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);
  pop.style.top = top + 'px';
}
function placePop(pop, anchor){
  pop._anchor = anchor;
  pop.hidden = false;
  positionPop(pop);
}
function closePops(){
  POPS.forEach(p => { p.hidden = true; });
  closeThemePop();
  closePalette();
}
function bindPopDismiss(pop, anchors){
  POPS.push(pop);
  document.addEventListener('click', e=>{
    if(pop.hidden) return;
    /* 浮层内部点了会重绘自己的按钮（表格的增删行列），这时 e.target 已经
       脱离文档，closest 一路走到 null，会被误判成「点了外面」。 */
    if(e.target.isConnected === false) return;
    if(pop.contains(e.target)) return;
    /* 从另一个浮层里点开的新浮层，会跟这次点击冒泡到 document。
       不排掉「点在任意浮层内」的情况，新浮层会被自己这个监听立刻关掉。 */
    if(e.target.closest && e.target.closest('.pop,.themepop,.palette')) return;
    if(anchors.some(sel => e.target.closest && e.target.closest(sel))) return;
    pop.hidden = true;
  });
  window.addEventListener('resize', ()=>{ if(!pop.hidden) positionPop(pop); });
  window.addEventListener('scroll', e=>{
    if(pop.hidden) return;
    if(pop.contains(e.target)) return;   /* 浮层内部的滚动不该影响定位 */
    positionPop(pop);
  }, true);
}

/* 插入内容一律写回左侧文档 —— 那里是唯一数据源，
   所以插进去的东西能跟着文稿一起存下来，换主题也不会丢。
   插入点取左侧光标；文档没被点过就追加到末尾。 */
function sourceInsert(text){
  const ta = $('#source');
  const focused = (document.activeElement === ta);
  const pos = (focused && ta.selectionStart != null) ? ta.selectionStart : ta.value.length;
  const before = ta.value.slice(0, pos);
  const after  = ta.value.slice(pos);
  const padL = (before && !/\n\n$/.test(before)) ? (/\n$/.test(before) ? '\n' : '\n\n') : '';
  const padR = (after && !/^\n/.test(after)) ? '\n\n' : '';
  const next = before + padL + text + padR + after;
  ta.value = next;
  state.source = next;
  const caret = (before + padL + text).length;
  try{ ta.setSelectionRange(caret, caret); }catch(e){}
  renderArticle();
  save();
}

/* ---------- 表格可视化编辑 ---------- */
let tblState = { cells: [], cur:{ r:0, c:0 } };

function freshTable(rows, cols){
  const cells = [];
  for(let i = 0; i < rows; i++){
    const row = [];
    for(let j = 0; j < cols; j++) row.push('');
    cells.push(row);
  }
  return { cells, cur:{ r:0, c:0 } };
}
tblState = freshTable(3, 3);

const tblPop = document.createElement('div');
tblPop.className = 'pop';
tblPop.hidden = true;

/* 输入框的 value 属性要单独转义，不能复用 esc（那是给正文文本用的） */
function attrEsc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderTblEditor(){
  const rows = tblState.cells.length;
  const cols = rows ? tblState.cells[0].length : 0;
  let body = '';
  for(let r = 0; r < rows; r++){
    body += '<tr' + (r === 0 ? ' class="head"' : '') + '>';
    for(let c = 0; c < cols; c++){
      body += '<td><input type="text" spellcheck="false" data-r="' + r + '" data-c="' + c + '"' +
        ' value="' + attrEsc(tblState.cells[r][c]) + '"' +
        ' placeholder="' + (r === 0 ? '表头' : '内容') + '"></td>';
    }
    body += '</tr>';
  }
  tblPop.innerHTML =
    '<p class="pop-h">编辑表格<span class="tlen">' + rows + ' 行 × ' + cols + ' 列</span></p>' +
    '<div class="tblwrap"><table class="tbled"><tbody>' + body + '</tbody></table></div>' +
    '<div class="tblbar">' +
      '<button type="button" data-op="rowAdd">＋ 行</button>' +
      '<button type="button" data-op="rowDel">－ 行</button>' +
      '<button type="button" data-op="colAdd">＋ 列</button>' +
      '<button type="button" data-op="colDel">－ 列</button>' +
      '<button type="button" data-op="clear">清空</button>' +
    '</div>' +
    '<p class="pop-hint">第一行自动作为表头；行列按钮作用于光标所在的那一行 / 那一列。</p>' +
    '<div class="pop-foot">' +
      '<button type="button" class="btn" data-op="cancel">取消</button>' +
      '<button type="button" class="btn primary" data-op="insert">插入表格</button>' +
    '</div>';
  const focusCell = tblPop.querySelector('input[data-r="' + tblState.cur.r + '"][data-c="' + tblState.cur.c + '"]');
  if(focusCell) focusCell.focus();
  /* 增删列会改变浮层宽度，位置必须按新尺寸重算，
     否则按钮会被推到视口外，点不到了 */
  if(!tblPop.hidden) positionPop(tblPop);
}

/* 结构变化前先把输入框里的内容读回来，否则重绘会把刚敲的字抹掉 */
function syncTblCells(){
  const trs = [...tblPop.querySelectorAll('table.tbled tr')];
  if(!trs.length) return;
  tblState.cells = trs.map(tr => [...tr.children].map(td=>{
    const i = td.querySelector('input');
    return i ? i.value : '';
  }));
}

function tblOp(op){
  if(op === 'cancel'){ tblPop.hidden = true; return; }
  if(op === 'insert'){
    syncTblCells();
    const cells = tblState.cells;
    if(!cells.length || !cells[0].length){ toast('表格至少要有 1 行 1 列', true); return; }
    const cell = v => (v || '').replace(/\|/g, '｜').replace(/[\r\n]+/g, ' ').trim() || ' ';
    const lines = cells.map(row => '| ' + row.map(cell).join(' | ') + ' |');
    const sep = '| ' + cells[0].map(()=>'---').join(' | ') + ' |';
    tblPop.hidden = true;
    sourceInsert([lines[0], sep, ...lines.slice(1)].join('\n'));
    toast('表格已插入 ' + cells.length + ' 行 × ' + cells[0].length + ' 列');
    return;
  }

  syncTblCells();
  let cells = tblState.cells.map(row => row.slice());
  const cols = cells[0] ? cells[0].length : 0;
  const r = Math.min(tblState.cur.r, cells.length - 1);
  const c = Math.min(tblState.cur.c, cols - 1);

  if(op === 'rowAdd'){ cells.splice(r + 1, 0, new Array(cols).fill('')); tblState.cur.r = r + 1; }
  else if(op === 'rowDel'){
    if(cells.length <= 1){ toast('至少要留一行', true); return; }
    cells.splice(r, 1);
    tblState.cur.r = Math.max(0, r - 1);
  }
  else if(op === 'colAdd'){
    cells.forEach(row => row.splice(c + 1, 0, ''));
    tblState.cur.c = c + 1;
  }
  else if(op === 'colDel'){
    if(cols <= 1){ toast('至少要留一列', true); return; }
    cells.forEach(row => row.splice(c, 1));
    tblState.cur.c = Math.max(0, c - 1);
  }
  else if(op === 'clear'){ cells = cells.map(row => row.map(()=>'')); }
  else { return; }

  tblState.cells = cells;
  renderTblEditor();
}

tblPop.addEventListener('click', e=>{
  const b = e.target.closest('[data-op]');
  if(b) tblOp(b.dataset.op);
});
tblPop.addEventListener('focusin', e=>{
  const i = e.target.closest ? e.target.closest('input[data-r]') : null;
  if(!i) return;
  tblState.cur.r = +i.dataset.r;
  tblState.cur.c = +i.dataset.c;
});

function openTblPop(anchor){
  if(!tblState.cells.length) tblState = freshTable(3, 3);
  renderTblEditor();
  placePop(tblPop, anchor);
}

/* 把当前主题的 cfg 与「全局样式」面板上的调整合并成一份新的主题配置。
   面板上的字号/行距等还没写回 cfg，不合并的话存下来就不是用户此刻看到的版本。 */
function currentThemeAsPreset(name){
  const cfg = Object.assign({}, state.theme.cfg);
  const g = state.g;
  if(g.size)      cfg.base = g.size;
  if(g.lh)        cfg.lh   = g.lh;
  if(g.ls != null)  cfg.ls  = g.ls;
  if(g.gap != null) cfg.gap = g.gap;
  if(g.family){
    const key = Object.keys(FONT).find(k => FONT[k] === g.family);
    if(key) cfg.font = key;
    else    cfg.fontCustom = g.family;   /* 「苹方」不是 FONT 的 key，只能原样存 */
  }
  if(g.useColor && g.color) cfg.fg = g.color;
  if(g.indent) cfg.indent = true;
  return {
    id: 'my-' + Date.now().toString(36),
    name: name,
    desc: '我的主题',
    custom: true,
    cfg: cfg
  };
}

async function saveCurrentAsTheme(){
  const t = getTheme(state.theme.id);

function removeCustomTheme(id){
  const i = customThemes.findIndex(t => t.id === id);
  if(i < 0) return;
  const nm = customThemes[i].name;
  const wasCurrent = (state.theme.id === id);
  customThemes.splice(i, 1);

  buildThemePop();

/* 文件读取 */
function readFile(file){
  const name = file.name.toLowerCase();
  if(name.endsWith('.docx')){
    readDocx(file);
    return;
  }
  const fr = new FileReader();
  fr.onload = ()=>{
    let text = fr.result || '';
    if(name.endsWith('.html') || name.endsWith('.htm')){
      const doc = new DOMParser().parseFromString(text, 'text/html');
      doc.querySelectorAll('script,style').forEach(n=>n.remove());
      const blocks = [];
      doc.body.querySelectorAll('h1,h2,h3,h4,p,li,blockquote').forEach(el=>{
        const t = el.textContent.replace(/\s+/g,' ').trim();
        if(!t) return;
        if(/^H1$/.test(el.tagName))      blocks.push('# '+t);
        else if(/^H2$/.test(el.tagName)) blocks.push('## '+t);
        else if(/^H[34]$/.test(el.tagName)) blocks.push('### '+t);
        else if(el.tagName==='LI')       blocks.push('- '+t);
        else if(el.tagName==='BLOCKQUOTE') blocks.push('> '+t);
        else                             blocks.push(t);
        blocks.push('');
      });
      text = blocks.join('\n');
    }
    $('#source').value = text;
    state.source = text;
    renderArticle(); save();
    toast('已导入：' + file.name);
  };
  fr.readAsText(file, 'utf-8');
}

/* .docx 用 mammoth 懒加载 */
function loadScript(src){
  return new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function readDocx(file){
  toast('正在解析 Word 文档…');
  try{
    if(!window.mammoth){
      await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js');
    }
    const buf = await file.arrayBuffer();
    const r = await window.mammoth.convertToMarkdown({arrayBuffer:buf});
    $('#source').value = r.value;
    state.source = r.value;
    renderArticle(); save();
    toast('已导入 Word：' + file.name);
  }catch(e){
    toast('Word 解析失败（需联网加载转换库），请另存为 .md 或 .txt 再上传', true);
  }
}

function save(){
  /* 这个函数在 init() 早期就会被 setAppTheme 调到，那时 state.theme 还没建好。
     它是纯副作用，任何时候都不能抛错，否则会把整个初始化打断。 */
  const payload = {
    source: state.source,
    theme: (state.theme && state.theme.id) || 'gu-feng',
    appTheme: state.appTheme,
    wide: state.wide,
    titleBlock: state.titleBlock,
    footnote: state.footnote,
    slim: state.slim,
    g: state.g,
    assets: state.assets,
    panel: !$('#stylePanel').hidden
  };
  try{
    localStorage.setItem('wxt-studio', JSON.stringify(payload));
  }catch(e){
    /* 图片多了会撑爆 localStorage（一般 5MB）。丢图片先保住文稿。 */
    delete payload.assets;
    try{ localStorage.setItem('wxt-studio', JSON.stringify(payload)); }catch(e2){ return; }
    if(!save._warned){
      save._warned = true;
      setTimeout(()=>toast('文稿已保存，但图片太多超出浏览器存储上限，刷新后图片需要重新插入', true), 300);
    }
  }
}
function load(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem('wxt-studio')||'null'); }catch(e){}
  return d;
}

/* ==========================================================
   11. 示例文稿
   ========================================================== */
const DEMO = `---
title: 挑西瓜，看准这一个地方就够了
author: 青简
date: 2026年9月18日
lead: 敲了半天听不出门道？其实不用听。西瓜甜不甜，看一眼瓜脐就知道。
h2_num: formal
---

夏天买瓜最怕"开盲盒"：抱回家切开，白瓤、淡味、还带生。摊主拍着胸脯说"保甜"，你也只能信。

其实挑瓜这事有硬标准，不用靠听声辨位，也不用赌运气。**记住下面四处，基本不会错**。

## 一看瓜脐：圈越小越甜

西瓜底部那个小圆圈叫瓜脐，是花谢之后留下的痕迹。

- **圈越小、越收紧** —— 说明发育充分，糖分攒得足
- **圈大而松、周围发白** —— 多半是生长期不足，味道偏淡
- **瓜脐微凹** —— 通常比平的要甜

这是最容易上手的一条，也是老瓜农最先看的地方。

## 二看瓜纹：纹路要"撑开"

成熟西瓜的表皮会被内部膨大的果肉撑出清晰的纹路：

> 好的西瓜，深色纹路和浅色底之间界线分明，纹路带有明显的"张开感"。
> 如果纹路细碎、模糊、颜色发闷，多半还没熟透。

同一批瓜里，纹路越舒展、底色越清亮的那一个，往往越值得买。

## 三掂重量：宁轻勿重

同样大小的两个瓜，**轻的那个通常更甜**。

水在瓜里以两种形式存在：结合水和自由水。糖分高的瓜，自由水偏少，拿在手里会觉得"轻而实"。太沉的，可能只是水多。

## 四看瓜藤：干枯弯曲才熟

瓜蒂上的那截藤蔓也叫瓜藤：

1. 藤蔓**青绿粗壮** —— 摘早了
2. 藤蔓**干枯、打卷** —— 正好熟
3. 完全脱落、留一个凹坑 —— 熟过头，口感发绵

---

## 常见误区

- **纹路越乱越好** —— 错，要看纹路是否清晰舒展，不是看乱
- **拍起来咚咚响就是好瓜** —— 声音只能判断成熟度，判断不了甜度
- **瓜越大越甜** —— 品种不同个头差异很大，同品种里中等偏大最稳

## 写在最后

挑瓜这件事，说到底就是**找证据**：脐、纹、重、藤，四个证据都指向同一个结论时，这只瓜基本不会差。

下次去菜市场，别再拍来拍去了。翻过来看一眼瓜脐，比什么都快。

> 挑瓜如此，挑很多东西都是如此。
`;

  if(d && d.panel){ $('#stylePanel').hidden = false; $('#btnStylePanel').textContent = '样式设置 ▴'; }

  syncGlobalFromTheme(false);

  renderArticle();

  /* 左右分栏拖拽 */
  const splitter = $('#splitter');
  let dragging = false;
  splitter.addEventListener('pointerdown', e=>{
    dragging = true;
    splitter.setPointerCapture(e.pointerId);
    document.body.style.cursor = 'col-resize';
  });
  splitter.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const rect = document.querySelector('.workspace').getBoundingClientRect();
    let w = e.clientX - rect.left - 12;
    w = Math.max(280, Math.min(w, rect.width-460));
    document.querySelector('.pane-src').style.setProperty('--left-w', w+'px');
    document.querySelector('.pane-src').style.width = w+'px';
  });
  const stop = ()=>{ dragging = false; document.body.style.cursor=''; };
  splitter.addEventListener('pointerup', stop);
  splitter.addEventListener('pointercancel', stop);

  /* 快捷键 */
  document.addEventListener('keydown', e=>{
    const mod = e.ctrlKey || e.metaKey;
    if(!mod) return;
    if(e.key==='s' || e.key==='S'){ e.preventDefault(); renderArticle(); toast('已重新排版'); }
    if(e.key==='e' && e.shiftKey){ e.preventDefault(); downloadHtml(); }
  });
}
